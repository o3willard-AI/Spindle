# cargo-audit configuration.
#
# RUSTSEC-2023-0071 (rsa @0.9.x, "Marvin Attack" - timing side-channel):
#   RustSec marks this advisory "No fixed upgrade is available!" — there is no
#   patched release to align to. The vulnerable `rsa` crate is pulled ONLY as a
#   transitive, feature-gated dependency of `sqlx-mysql`, the MySQL backend of
#   the sqlx crate — which this workspace does NOT enable (sqlx is used with
#   `postgres` only, and the facade is declared `default-features = false`).
#   The edge is intrinsic to the upstream sqlx manifest and cannot be removed by
#   version alignment; cargo-audit reports it from the lockfile's declared-
#   optional edges, but the crate is never compiled into any build target here.
#   (cargo-deny's reachability analysis confirms this: it does not even see rsa.)
#   Rationale also recorded in AUDIT-REPORT.md.
# RUSTSEC-2025-0134 (rustls-pemfile — unmaintained):
#   Not a vulnerability, an unmaintained-crates.io warning. The only edge into
#   the lockfile is axum-server 0.7's optional `tls-rustls` integration, which
#   our `tls` feature pulls in for serving HTTPS. Our own code never calls
#   rustls-pemfile directly (main.rs loads certs via
#   axum_server::tls_rustls::RustlsConfig::from_pem_file). The crate's
#   successor (rustls-pemfile 2.x -> rustls-pki-types) is absorbed upstream in
#   axum-server 0.8; upgrading that is tracked separately since it changes the
#   server's TLS setup API. Ignored as a warning-only advisory with this
#   justification until the axum-server upgrade lands.
[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2025-0134",
]