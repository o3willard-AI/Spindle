[workspace]
members = [
	"spindle-server",
	"spindle-worker",
	"spindle-cli",
	"spindle-config",
	"spindle-obs",
	"spindle-error",
	"spindle-rawarchive",
	"spindle-store",
	"spindle-pipeline",
	"spindle-ingest",
	"spindle-api",
	"spindle-identity",
	"spindle-tokens",
	"spindle-authz",
	"spindle-signing",
	"spindle-compliance",
	"spindle-archive",
	"spindle-corpus-capture",
]
resolver = "2"

[workspace.package]
authors = ["Spindle Team"]
version = "0.1.0"
edition = "2021"

# ── Workspace-level dependency versions ────────────────────────────────
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
time = { version = "0.3", features = ["serde", "macros"] }
object_store = "0.11"
openidconnect = "4"
jsonwebtoken = "9"
argon2 = "0.5"
parquet = "54"
arrow = "54"

# Internal crate references (use workspace = true in dependents)
spindle-config = { path = "spindle-config" }
spindle-obs = { path = "spindle-obs" }
spindle-error = { path = "spindle-error" }
spindle-rawarchive = { path = "spindle-rawarchive" }
spindle-store = { path = "spindle-store" }
spindle-pipeline = { path = "spindle-pipeline" }
spindle-ingest = { path = "spindle-ingest" }
spindle-api = { path = "spindle-api" }
spindle-identity = { path = "spindle-identity" }
spindle-tokens = { path = "spindle-tokens" }
spindle-authz = { path = "spindle-authz" }
spindle-signing = { path = "spindle-signing" }
spindle-compliance = { path = "spindle-compliance" }
spindle-archive = { path = "spindle-archive" }
spindle-corpus-capture = { path = "spindle-corpus-capture" }
