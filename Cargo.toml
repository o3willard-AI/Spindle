[workspace]
members = [
	"spindle-server",
	"spindle-worker",
	"spindle-cli",
	"spindle-config",
	"spindle-obs",
	"spindle-error",
	"spindle-rawarchive",
	"spindle-store",
	"spindle-pipeline",
	"spindle-api",
	"spindle-identity",
	"spindle-authz",
	"spindle-signing",
	"spindle-compliance",
	"spindle-archive",
	"spindle-shutdown",
	"spindle-migrate",
	"spindle-dex",
	"spindle-saml",
	"spindle-bench",
	"spindle-dashboard",
	"mcp-server",
	"spindle-mcp",
]
resolver = "2"

[workspace.package]
authors = ["Spindle Team"]
version = "0.2.4"
edition = "2021"

# ── Workspace-level dependency versions ────────────────────────────────
[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.7", features = ["v4", "v5", "serde"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
thiserror = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
time = { version = "0.3", features = ["serde", "macros"] }
object_store = "0.14"
openidconnect = "3"
jsonwebtoken = "9"
argon2 = "0.5"
parquet = "59"
arrow = "59"
hyper = { version = "1", features = ["http1", "client"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
http-body-util = "0.1"
hex = "0.4"
sha2 = "0.10"
subtle = "2.6"
governor = "0.7"
async-trait = "0.1"
openssl = { version = "0.10", features = ["vendored"] }
ldap3 = "0.12"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
askama = "0.12"

# Internal crate references (use workspace = true in dependents)
spindle-config = { path = "spindle-config", version = "0.2" }
spindle-server = { path = "spindle-server", version = "0.2" }
spindle-obs = { path = "spindle-obs", version = "0.2" }
spindle-error = { path = "spindle-error", version = "0.2" }
spindle-rawarchive = { path = "spindle-rawarchive", version = "0.2" }
spindle-store = { path = "spindle-store", version = "0.2" }
spindle-pipeline = { path = "spindle-pipeline", version = "0.2" }
spindle-api = { path = "spindle-api", version = "0.2" }
spindle-identity = { path = "spindle-identity", version = "0.2" }
spindle-dex = { path = "spindle-dex", version = "0.2" }
spindle-authz = { path = "spindle-authz", version = "0.2" }
spindle-signing = { path = "spindle-signing", version = "0.2" }
spindle-compliance = { path = "spindle-compliance", version = "0.2" }
spindle-archive = { path = "spindle-archive", version = "0.2" }
spindle-shutdown = { path = "spindle-shutdown", version = "0.2" }
spindle-saml = { path = "spindle-saml", version = "0.2" }
mcp-server = { path = "mcp-server", version = "0.2" }
spindle-mcp = { path = "spindle-mcp", version = "0.2" }

