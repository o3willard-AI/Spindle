# cargo-deny configuration
# https://github.com/EmbarkStudios/cargo-deny

[licenses]
# The license of the workspace will be determined automatically.
# SPDX identifier for the project license.
# This is a placeholder — adjust based on your project's actual license.
confidence-threshold = 0.8
# Allow common permissive open-source licenses used by dependencies
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
# Do not allow crates from non-registry sources without explicit listing
unknown-git = "deny"
unknown-registry = "warn"

[advisories]
ignore = [
]
