[package]
name = "spindle-archive"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
parquet = { version = "59", features = ["arrow"] }
arrow = { version = "59", default-features = false, features = ["csv", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
tracing = { workspace = true }
spindle-store = { path = "../spindle-store", version = "0.1" }
spindle-signing = { path = "../spindle-signing", version = "0.1" }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
duckdb = { version = "1.2", features = ["parquet"] }
