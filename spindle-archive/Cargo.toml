[package]
name = "spindle-archive"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
parquet = { version = "59", features = ["arrow"] }
arrow = { version = "59", default-features = false, features = ["csv", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
tracing = { workspace = true }
spindle-store = { path = "../spindle-store", version = "0.1" }
spindle-signing = { path = "../spindle-signing", version = "0.1" }
duckdb = { version = "1.2", features = ["parquet"], optional = true }  # test-only validator, gated by duckdb-validation feature

[features]
# DuckDB is a test-only validator for the Parquet archive export (schema + query
# parity checks in tests/duckdb_validation.rs). It is feature-gated because its
# C++ binding (libduckdb-sys) is a ~20GB build that cannot complete on GitHub's
# free 7GB/14GB runners. Postgres remains the operational datastore; DuckDB is
# never used at runtime. Enable explicitly with `--features duckdb-validation`.
duckdb-validation = ["dep:duckdb"]

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
