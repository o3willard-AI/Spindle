[package]
name = "spindle-server"
version.workspace = true
edition = "2021"
build = "build.rs"
license = "MIT OR Apache-2.0"

[dependencies]
spindle-obs = { path = "../spindle-obs" }
tower = { workspace = true }
tokio = { workspace = true }
axum = { version = "0.7", features = ["macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
figment = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
tempfile = "3.10"
subtle = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
governor = { workspace = true }
tower-http = { version = "0.5", features = ["trace", "request-id", "util"] }
jsonwebtoken = "9"
argon2 = { workspace = true }
ldap3 = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
rand = "0.8"
axum-server = { version = "0.7", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }

spindle-rawarchive = { path = "../spindle-rawarchive", version = "0.3" }
spindle-config = { path = "../spindle-config", version = "0.3" }
spindle-api = { path = "../spindle-api", version = "0.3" }
spindle-store = { path = "../spindle-store", version = "0.3" }
spindle-authz = { path = "../spindle-authz", version = "0.3" }
spindle-signing = { path = "../spindle-signing", version = "0.3" }
spindle-dex = { path = "../spindle-dex", version = "0.3" }
spindle-saml = { path = "../spindle-saml", version = "0.3" }
spindle-pipeline = { path = "../spindle-pipeline", version = "0.3" }
async-trait = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[dev-dependencies]
tokio = { version = "1.36", features = ["full", "test-util"] }
toml = "0.8"

[features]
default = []
tls = ["axum-server/tls-rustls", "dep:axum-server", "dep:rustls"]

[[bin]]
name = "spindle-server"
path = "src/main.rs"
