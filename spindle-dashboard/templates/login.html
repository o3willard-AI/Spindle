<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spindle · Sign in</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body hx-boost="true">
  <main class="container login-wrap">
    <div class="login-card">
      <h1>Spindle Dashboard</h1>
      <p class="muted">Enter your Spindle API token to connect. The token is stored only in your browser and is sent to the API on every request.</p>
      <form id="login-form">
        <label for="token-input">API token</label>
        <input id="token-input" type="password" placeholder="spindle token" autocomplete="off">
        <button type="submit" class="btn">Connect</button>
      </form>
      <p class="muted small">API: {{ api_url }}</p>
    </div>
  </main>
</body>
</html>
