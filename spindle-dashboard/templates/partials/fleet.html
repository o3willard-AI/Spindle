{% for n in nodes %}
<tr>
  <td><a href="/nodes/{{ n.name }}">{{ n.name }}</a></td>
  <td>{{ n.platform }}</td>
  <td>{{ n.chef_environment }}</td>
  <td>{{ n.last_seen }}</td>
  <td><span class="pill {{ n.status_class() }}">{{ n.display_status() }}</span></td>
</tr>
{% else %}
<tr><td colspan="5" class="muted">No registered nodes yet.</td></tr>
{% endfor %}
