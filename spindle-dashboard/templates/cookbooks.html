{% extends "base.html" %}
{% block title %}Spindle · Cookbooks{% endblock %}
{% block content %}
<h1>Cookbooks</h1>
<table class="table">
  <thead>
    <tr><th>Name</th><th>Versions</th><th>Total Nodes</th><th>Last Seen</th></tr>
  </thead>
  <tbody>
    {% for b in books %}
    <tr>
      <td><a href="/cookbooks/{{ b.name }}">{{ b.name }}</a></td>
      <td>{{ b.versions }}</td>
      <td>{{ b.total_nodes }}</td>
      <td>{{ b.last_seen }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="muted">No cookbook inventory yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
