<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spindle{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body hx-boost="true">
  <header class="topbar">
    <div class="brand">Spindle</div>
    <nav class="nav">
      <a href="/dashboard" class="{% if page_name == "dashboard" %}active{% endif %}">Dashboard</a>
      <a href="/nodes" class="{% if page_name == "nodes" %}active{% endif %}">Nodes</a>
      <a href="/runs" class="{% if page_name == "runs" %}active{% endif %}">Runs</a>
      <a href="/compliance" class="{% if page_name == "compliance" %}active{% endif %}">Compliance</a>
      <a href="/cookbooks" class="{% if page_name == "cookbooks" %}active{% endif %}">Cookbooks</a>
    </nav>
    <div class="api-badge" id="api-badge">{{ api_url }}</div>
  </header>
  <div id="auth-status" class="auth-status"></div>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
