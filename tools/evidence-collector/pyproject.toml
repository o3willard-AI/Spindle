[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "spindle-evidence-collector"
version = "0.1.0"
description = "Report Builder — turns Spindle API data into user-facing evidence views"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "jinja2>=3.1",
]

[project.scripts]
evidence-collector = "evidence_collector.main:main"

[tool.setuptools.packages.find]
where = ["src"]
