# Spindle — shared configuration file
# This file is shared by spindle-server, spindle-worker, and spindle-cli.
# Path: ~/.spindle/config.toml or $SPINDLE_CONFIG

# ── Server ─────────────────────────────────────────────────────────────────────

[server]
host = "127.0.0.1"
port = 3000
max-connections = 1024
read-timeout-secs = 30
write-timeout-secs = 60
cors-enabled = false
behind-proxy = false

# ── Database ───────────────────────────────────────────────────────────────────

[database]
url = "postgres://spindle:CHANGE_ME@localhost:5432/spindle"
pool-max = 10
pool-min = 2
connect-timeout-secs = 30
health-check = true
max-lifetime-secs = 1800

# ── Storage ────────────────────────────────────────────────────────────────────

[storage]
backend = "local"
bucket = "spindle-data"
region = "us-east-1"
max-part-size-bytes = 5242880
path-style = false

# ── Signing ────────────────────────────────────────────────────────────────────

[signing]
mode = "disabled"
hash-algorithm = "sha256"
include-public-key = true

# ── Identity (OIDC) ─────────────────────────────────────────────────────────────

[identity]
scopes = ["openid", "email"]
refresh-buffer-secs = 300
session-timeout-secs = 3600
mappings = []

# ── CLI profiles ───────────────────────────────────────────────────────────────
# Each profile defines a Spindle server endpoint.
# Tokens are stored in the OS keyring, NOT in this file.
# Override with: --profile=<name> or SPINDLE_PROFILE=<name>

[profiles.default]
url = "http://127.0.0.1:3000"

