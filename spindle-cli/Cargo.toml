[package]
name = "spindle-cli"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "spindle_cli"
path = "src/lib.rs"

[[bin]]
name = "spindle"
path = "src/main.rs"

[dependencies]
spindle-obs = { path = "../spindle-obs" }
clap = { workspace = true, features = ["env"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = "0.8"
spindle-config = { path = "../spindle-config", version = "0.2" }
spindle-signing = { path = "../spindle-signing", version = "0.2" }
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
signature = "3"
base64 = "0.22"
walkdir = "2"
flate2 = "1"
hex = "0.4"
comfy-table = "8"

[dev-dependencies]
clap = { version = "4", features = ["derive", "env", "debug"] }
tempfile = "3"